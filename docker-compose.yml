version: "3.8"

services:
  growth-world:
    build:
      context: .
      dockerfile: Dockerfile
    image: viplu56/growth-world:latest
    container_name: growth-world
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/growth_world.db}
      - DEFAULT_PARENT_PASSWORD=${DEFAULT_PARENT_PASSWORD:-admin123}
      - DEFAULT_CHILD_PASSWORD=${DEFAULT_CHILD_PASSWORD:-admin123}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    volumes:
      - growth_data:/app/backend/data
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  growth_data: