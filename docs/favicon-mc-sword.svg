<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 我的世界 钻石剑（45°斜放，加宽剑身强化钻石色） -->
  <defs>
    <linearGradient id="wsB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9FF7F0"/>
      <stop offset="100%" stop-color="#40C8BA"/>
    </linearGradient>
    <linearGradient id="wsEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#35B8AA"/>
      <stop offset="100%" stop-color="#1E8278"/>
    </linearGradient>
    <linearGradient id="wsH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B08044"/>
      <stop offset="100%" stop-color="#8A5E32"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0e1626"/>
  <g transform="rotate(-45 32 26)">
    <!-- 剑身（加宽） -->
    <g>
      <path d="M22 4 L42 4 L42 34 L22 34 Z" fill="url(#wsB)" stroke="#1e8a7e" stroke-width="1"/>
      <path d="M22 34 L42 34 L32 50 Z" fill="#54d8cc" stroke="#1e8a7e" stroke-width="1"/>
      <path d="M32 4 L42 4 L42 50 L32 34 Z" fill="url(#wsEdge)" stroke="#145f58" stroke-width="1"/>
      <path d="M26 4 L32 4 L32 34 L26 34 Z" fill="#ffffff" opacity="0.45"/>
      <path d="M32 34 L32 48 L36 44 L32 34 Z" fill="#ffffff" opacity="0.3"/>
    </g>
    <!-- 护手（缩小，贴合MC风格） -->
    <path d="M20 32 L44 32 L46 38 L18 38 Z" fill="#7a5a2e" stroke="#4a2d15" stroke-width="1"/>
    <path d="M18 38 L46 38 L44 41 L16 41 Z" fill="#6a4c24" stroke="#4a2d15" stroke-width="0.6"/>
    <!-- 剑柄 -->
    <rect x="28" y="40" width="8" height="12" fill="url(#wsH)" stroke="#4a2d15" stroke-width="0.8"/>
    <rect x="26" y="50" width="12" height="4" rx="2" fill="#6e4622" stroke="#4a2d15" stroke-width="0.6"/>
  </g>
</svg>